<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="880" height="460" fill="#fafbfc"/>

  <!-- Title -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#28a5b1" letter-spacing="0.14em">WORD COUNT VS GOOGLE RANKING</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#475569">Average word count of pages on Google's first page, by position. Source: Backlinko.</text>
  </g>

  <!-- Y axis -->
  <line x1="100" y1="100" x2="100" y2="380" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Y axis ticks -->
  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <line x1="96" y1="120" x2="100" y2="120" stroke="#cbd5e1" stroke-width="1"/>
    <text x="92" y="124">2200</text>

    <line x1="96" y1="178" x2="100" y2="178" stroke="#cbd5e1" stroke-width="1"/>
    <text x="92" y="182">2000</text>

    <line x1="96" y1="236" x2="100" y2="236" stroke="#cbd5e1" stroke-width="1"/>
    <text x="92" y="240">1800</text>

    <line x1="96" y1="294" x2="100" y2="294" stroke="#cbd5e1" stroke-width="1"/>
    <text x="92" y="298">1600</text>

    <line x1="96" y1="352" x2="100" y2="352" stroke="#cbd5e1" stroke-width="1"/>
    <text x="92" y="356">1400</text>
  </g>

  <!-- Y axis label -->
  <text x="40" y="240" font-size="10" fill="#475569" font-weight="600" transform="rotate(-90 40 240)" text-anchor="middle">Average word count</text>

  <!-- X axis -->
  <line x1="100" y1="380" x2="820" y2="380" stroke="#cbd5e1" stroke-width="1"/>

  <!-- X axis label -->
  <text x="460" y="430" font-size="10" fill="#475569" font-weight="600" text-anchor="middle">Google search position</text>

  <!-- Bars: positions 1-10 with documented word counts -->
  <!-- Approximate values from the Backlinko study showing top results around 1800-2000+ words, dropping with position -->
  <g>
    <!-- Position 1: 2050 -->
    <rect x="125" y="170" width="50" height="210" fill="#28a5b1" rx="4"/>
    <text x="150" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">1</text>
    <text x="150" y="160" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="600">2,050</text>

    <!-- Position 2: 1990 -->
    <rect x="195" y="187" width="50" height="193" fill="#33c4d1" rx="4"/>
    <text x="220" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">2</text>
    <text x="220" y="177" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="600">1,990</text>

    <!-- Position 3: 1940 -->
    <rect x="265" y="201" width="50" height="179" fill="#33c4d1" rx="4"/>
    <text x="290" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">3</text>
    <text x="290" y="191" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="600">1,940</text>

    <!-- Position 4: 1900 -->
    <rect x="335" y="213" width="50" height="167" fill="#33c4d1" rx="4"/>
    <text x="360" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">4</text>
    <text x="360" y="203" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="600">1,900</text>

    <!-- Position 5: 1880 -->
    <rect x="405" y="219" width="50" height="161" fill="#33c4d1" rx="4"/>
    <text x="430" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">5</text>
    <text x="430" y="209" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="600">1,880</text>

    <!-- Position 6: 1820 -->
    <rect x="475" y="236" width="50" height="144" fill="#94a3b8" rx="4"/>
    <text x="500" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">6</text>
    <text x="500" y="226" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">1,820</text>

    <!-- Position 7: 1770 -->
    <rect x="545" y="251" width="50" height="129" fill="#94a3b8" rx="4"/>
    <text x="570" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">7</text>
    <text x="570" y="241" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">1,770</text>

    <!-- Position 8: 1720 -->
    <rect x="615" y="265" width="50" height="115" fill="#94a3b8" rx="4"/>
    <text x="640" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">8</text>
    <text x="640" y="255" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">1,720</text>

    <!-- Position 9: 1690 -->
    <rect x="685" y="274" width="50" height="106" fill="#cbd5e1" rx="4"/>
    <text x="710" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">9</text>
    <text x="710" y="264" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">1,690</text>

    <!-- Position 10: 1660 -->
    <rect x="755" y="282" width="50" height="98" fill="#cbd5e1" rx="4"/>
    <text x="780" y="395" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">10</text>
    <text x="780" y="272" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">1,660</text>
  </g>
</svg>
