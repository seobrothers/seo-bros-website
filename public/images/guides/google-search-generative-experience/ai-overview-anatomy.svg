<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="960" height="540" fill="#fafbfc"/>

  <!-- Title -->
  <g transform="translate(40, 34)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#28a5b1" letter-spacing="0.14em">ANATOMY OF AN AI OVERVIEW</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#475569">Three things happen at once when an AI Overview appears on the results page.</text>
  </g>

  <!-- ===== Source page cards (left) ===== -->
  <text x="60" y="120" font-size="11" font-weight="700" fill="#369962">Source pages</text>
  <g>
    <rect x="60" y="132" width="150" height="44" rx="6" fill="#ffffff" stroke="#bfe6cf" stroke-width="1.5"/>
    <rect x="72" y="146" width="80" height="6" rx="3" fill="#44b97b"/>
    <rect x="72" y="160" width="120" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="60" y="186" width="150" height="44" rx="6" fill="#ffffff" stroke="#bfe6cf" stroke-width="1.5"/>
    <rect x="72" y="200" width="90" height="6" rx="3" fill="#44b97b"/>
    <rect x="72" y="214" width="110" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="60" y="240" width="150" height="44" rx="6" fill="#ffffff" stroke="#bfe6cf" stroke-width="1.5"/>
    <rect x="72" y="254" width="70" height="6" rx="3" fill="#44b97b"/>
    <rect x="72" y="268" width="120" height="4" rx="2" fill="#cbd5e1"/>
  </g>
  <!-- arrows into overview -->
  <g stroke="#44b97b" stroke-width="1.5" fill="none">
    <path d="M210 154 C 270 154, 290 175, 348 180"/>
    <path d="M210 208 C 270 208, 300 200, 348 196"/>
    <path d="M210 262 C 270 262, 300 215, 348 212"/>
  </g>
  <path d="M348 180 l-9 -1 l5 7 Z" fill="#44b97b"/>
  <text x="70" y="306" font-size="11" font-weight="700" fill="#369962">(2) Google selects</text>
  <text x="70" y="322" font-size="11" fill="#475569">&amp; links source pages</text>

  <!-- ===== SERP frame (center) ===== -->
  <rect x="350" y="110" width="320" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- search bar -->
  <rect x="372" y="128" width="276" height="22" rx="11" fill="#f1f5f9"/>
  <!-- AI Overview block -->
  <rect x="372" y="160" width="276" height="120" rx="8" fill="#f4eefa" stroke="#c9b3df" stroke-width="1.5"/>
  <text x="384" y="180" font-size="11" font-weight="700" fill="#6f4e88">AI Overview</text>
  <rect x="384" y="190" width="252" height="6" rx="3" fill="#c9b3df"/>
  <rect x="384" y="204" width="252" height="6" rx="3" fill="#c9b3df"/>
  <rect x="384" y="218" width="210" height="6" rx="3" fill="#c9b3df"/>
  <rect x="384" y="232" width="240" height="6" rx="3" fill="#c9b3df"/>
  <text x="384" y="262" font-size="9" font-weight="600" fill="#6f4e88">Sources:</text>
  <circle cx="438" cy="259" r="8" fill="#8c63aa"/><text x="438" y="262" font-size="9" fill="#fff" text-anchor="middle">1</text>
  <circle cx="460" cy="259" r="8" fill="#8c63aa"/><text x="460" y="262" font-size="9" fill="#fff" text-anchor="middle">2</text>
  <circle cx="482" cy="259" r="8" fill="#8c63aa"/><text x="482" y="262" font-size="9" fill="#fff" text-anchor="middle">3</text>
  <!-- organic results pushed down -->
  <rect x="372" y="296" width="276" height="40" rx="6" fill="#ffffff" stroke="#28a5b1" stroke-width="1.5"/>
  <rect x="384" y="308" width="150" height="7" rx="3.5" fill="#28a5b1"/>
  <rect x="384" y="322" width="220" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="372" y="344" width="276" height="40" rx="6" fill="#ffffff" stroke="#28a5b1" stroke-width="1.5"/>
  <rect x="384" y="356" width="170" height="7" rx="3.5" fill="#28a5b1"/>
  <rect x="384" y="370" width="200" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="372" y="392" width="276" height="40" rx="6" fill="#ffffff" stroke="#28a5b1" stroke-width="1.5"/>
  <rect x="384" y="404" width="140" height="7" rx="3.5" fill="#28a5b1"/>
  <rect x="384" y="418" width="225" height="5" rx="2.5" fill="#cbd5e1"/>
  <text x="510" y="456" font-size="9.5" fill="#94a3b8" text-anchor="middle">. . .</text>

  <!-- ===== Annotations (right) ===== -->
  <!-- (1) Gemini synthesizes -->
  <g stroke="#8c63aa" stroke-width="1.5" fill="none">
    <path d="M700 200 L 652 215"/>
  </g>
  <circle cx="700" cy="200" r="3" fill="#8c63aa"/>
  <text x="712" y="190" font-size="11" font-weight="700" fill="#6f4e88">(1) Gemini synthesizes</text>
  <text x="712" y="206" font-size="11" fill="#475569">a generated answer at the</text>
  <text x="712" y="222" font-size="11" fill="#475569">top of the page.</text>

  <!-- (3) organic pushed down -->
  <g stroke="#28a5b1" stroke-width="1.5" fill="none">
    <path d="M700 360 L 652 360"/>
  </g>
  <circle cx="700" cy="360" r="3" fill="#28a5b1"/>
  <text x="712" y="350" font-size="11" font-weight="700" fill="#1e8892">(3) Organic results</text>
  <text x="712" y="366" font-size="11" fill="#475569">are pushed down the</text>
  <text x="712" y="382" font-size="11" fill="#475569">page, even if you're</text>
  <text x="712" y="398" font-size="11" fill="#475569">a cited source.</text>
  <!-- down arrow -->
  <g transform="translate(820,420)" stroke="#28a5b1" stroke-width="2" fill="none">
    <line x1="0" y1="0" x2="0" y2="40"/>
  </g>
  <path d="M820 462 l-5 -8 l10 0 Z" fill="#28a5b1"/>
</svg>
