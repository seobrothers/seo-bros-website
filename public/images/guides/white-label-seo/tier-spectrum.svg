<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="960" height="480" fill="#fafbfc"/>

  <!-- Heading -->
  <text x="60" y="44" font-size="11" font-weight="700" fill="#44b97b" letter-spacing="0.14em">THE WHITE LABEL SPECTRUM</text>
  <text x="60" y="70" font-size="15" font-weight="500" fill="#475569">Three models, sorted by how much of the work you keep versus hand over.</text>

  <!-- Direction labels -->
  <text x="60" y="104" font-size="12" font-weight="600" fill="#94a3b8">More of the work stays on you</text>
  <text x="900" y="104" text-anchor="end" font-size="12" font-weight="600" fill="#28a5b1">More of it is handled for you</text>
  <line x1="60" y1="114" x2="900" y2="114" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="900,114 890,109 890,119" fill="#28a5b1"/>

  <!-- ============ CARD 1: FULFILMENT DESK ============ -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="264" height="310" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M0 10 a10 10 0 0 1 10 -10 h244 a10 10 0 0 1 10 10 v42 h-264 z" fill="#94a3b8"/>
    <text x="132" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Fulfilment desk</text>

    <text x="20" y="82" font-size="12.5" fill="#475569">You bring strategy and sales.</text>
    <text x="20" y="100" font-size="12.5" fill="#475569">They execute the tasks you order,</text>
    <text x="20" y="118" font-size="12.5" fill="#475569">à la carte or by the hour.</text>

    <text x="20" y="152" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">WHO DOES THE WORK</text>
    <rect x="20" y="160" width="152" height="12" rx="3" fill="#64748b"/>
    <rect x="172" y="160" width="72" height="12" rx="3" fill="#cbd5e1"/>
    <text x="20" y="190" font-size="10" fill="#64748b">You</text>
    <text x="244" y="190" text-anchor="end" font-size="10" fill="#94a3b8">Partner</text>

    <text x="20" y="224" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">BEST FOR</text>
    <text x="20" y="244" font-size="12.5" font-weight="600" fill="#334155">You have strategy,</text>
    <text x="20" y="262" font-size="12.5" font-weight="600" fill="#334155">want cheap hands.</text>

    <line x1="20" y1="280" x2="244" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="298" font-size="11" fill="#94a3b8">The HOTH · SEOReseller · E2M</text>
  </g>

  <!-- ============ CARD 2: MANAGED CAMPAIGNS ============ -->
  <g transform="translate(348,140)">
    <rect x="0" y="0" width="264" height="310" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M0 10 a10 10 0 0 1 10 -10 h244 a10 10 0 0 1 10 10 v42 h-264 z" fill="#33c4d1"/>
    <text x="132" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Managed campaigns</text>

    <text x="20" y="82" font-size="12.5" fill="#475569">They run per-client strategy</text>
    <text x="20" y="100" font-size="12.5" fill="#475569">and execution, invisibly. You</text>
    <text x="20" y="118" font-size="12.5" fill="#475569">still sell it and train your team.</text>

    <text x="20" y="152" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">WHO DOES THE WORK</text>
    <rect x="20" y="160" width="101" height="12" rx="3" fill="#64748b"/>
    <rect x="121" y="160" width="123" height="12" rx="3" fill="#33c4d1"/>
    <text x="20" y="190" font-size="10" fill="#64748b">You</text>
    <text x="244" y="190" text-anchor="end" font-size="10" fill="#33c4d1">Partner</text>

    <text x="20" y="224" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">BEST FOR</text>
    <text x="20" y="244" font-size="12.5" font-weight="600" fill="#334155">You want delivery</text>
    <text x="20" y="262" font-size="12.5" font-weight="600" fill="#334155">off your plate.</text>

    <line x1="20" y1="280" x2="244" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="298" font-size="11" fill="#94a3b8">Semify</text>
  </g>

  <!-- ============ CARD 3: STRATEGIC PARTNER ============ -->
  <g transform="translate(636,140)">
    <rect x="-2" y="-2" width="268" height="314" rx="11" fill="#ffffff" stroke="#28a5b1" stroke-width="2"/>
    <path d="M0 10 a10 10 0 0 1 10 -10 h244 a10 10 0 0 1 10 10 v42 h-264 z" fill="#28a5b1"/>
    <text x="132" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Strategic partner</text>

    <text x="20" y="82" font-size="12.5" fill="#475569">They run strategy and execution</text>
    <text x="20" y="100" font-size="12.5" fill="#475569">and back your sales. You own</text>
    <text x="20" y="118" font-size="12.5" fill="#475569">the client and the pricing.</text>

    <text x="20" y="152" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">WHO DOES THE WORK</text>
    <rect x="20" y="160" width="67" height="12" rx="3" fill="#64748b"/>
    <rect x="87" y="160" width="157" height="12" rx="3" fill="#28a5b1"/>
    <text x="20" y="190" font-size="10" fill="#64748b">You</text>
    <text x="244" y="190" text-anchor="end" font-size="10" fill="#28a5b1">Partner</text>

    <text x="20" y="224" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.1em">BEST FOR</text>
    <text x="20" y="244" font-size="12.5" font-weight="600" fill="#334155">You want to grow</text>
    <text x="20" y="262" font-size="12.5" font-weight="600" fill="#334155">the SEO line.</text>

    <line x1="20" y1="280" x2="244" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="298" font-size="11" fill="#94a3b8">Boostability · That! Company · <tspan font-weight="700" fill="#28a5b1">SEO Brothers</tspan></text>
  </g>
</svg>
