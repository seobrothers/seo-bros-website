<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="960" height="420" fill="#fafbfc"/>

  <!-- Heading -->
  <text x="60" y="44" font-size="11" font-weight="700" fill="#44b97b" letter-spacing="0.14em">COLLABORATION UNDER YOUR OWN DOMAIN</text>
  <text x="60" y="70" font-size="15" font-weight="500" fill="#475569">How the partnership stays invisible to the people you serve.</text>

  <!-- ===== BOX 1: SEO Brothers (invisible) ===== -->
  <rect x="60" y="130" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="76" y="146" width="118" height="20" rx="10" fill="#eef2f6"/>
  <text x="135" y="160" text-anchor="middle" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.08em">STAYS INVISIBLE</text>
  <text x="180" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">SEO Brothers</text>
  <text x="180" y="232" text-anchor="middle" font-size="12" fill="#64748b">Strategy, content,</text>
  <text x="180" y="250" text-anchor="middle" font-size="12" fill="#64748b">links, reporting</text>

  <!-- arrow 1 -->
  <line x1="300" y1="205" x2="356" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="360,205 350,200 350,210" fill="#94a3b8"/>
  <text x="330" y="195" text-anchor="middle" font-size="9.5" fill="#94a3b8">delivers</text>

  <!-- ===== BOX 2: Your portal (prominent) ===== -->
  <rect x="360" y="130" width="240" height="150" rx="10" fill="#ffffff" stroke="#28a5b1" stroke-width="2"/>
  <rect x="360" y="130" width="240" height="6" rx="3" fill="#28a5b1"/>
  <text x="480" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Your agency portal</text>
  <text x="480" y="194" text-anchor="middle" font-size="12.5" font-weight="600" fill="#28a5b1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">portal.youragency.com</text>
  <text x="480" y="212" text-anchor="middle" font-size="10.5" fill="#94a3b8">CNAME pointed at our platform</text>
  <rect x="378" y="232" width="68" height="22" rx="11" fill="#e6f7f8"/>
  <text x="412" y="247" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c7d87">Updates</text>
  <rect x="450" y="232" width="70" height="22" rx="11" fill="#e6f7f8"/>
  <text x="485" y="247" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c7d87">Feedback</text>
  <rect x="524" y="232" width="74" height="22" rx="11" fill="#e6f7f8"/>
  <text x="561" y="247" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c7d87">Approvals</text>

  <!-- arrow 2 -->
  <line x1="600" y1="205" x2="656" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="660,205 650,200 650,210" fill="#94a3b8"/>
  <text x="630" y="195" text-anchor="middle" font-size="9.5" fill="#94a3b8">sign-off</text>

  <!-- ===== BOX 3: Your client ===== -->
  <rect x="660" y="130" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="780" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Your client</text>
  <text x="780" y="232" text-anchor="middle" font-size="12" fill="#64748b">Reviews and approves</text>
  <text x="780" y="250" text-anchor="middle" font-size="12" fill="#64748b">work under your brand</text>

  <!-- ===== Bottom banner ===== -->
  <rect x="60" y="318" width="840" height="54" rx="10" fill="#f0fdf6" stroke="#44b97b" stroke-width="1.5"/>
  <circle cx="100" cy="345" r="11" fill="#44b97b"/>
  <path d="M95 345 l3.5 3.5 l6 -7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="350" font-size="14" font-weight="600" fill="#256b45">Our name appears nowhere your client can ever see.</text>
</svg>
