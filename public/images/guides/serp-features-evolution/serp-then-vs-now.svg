<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="960" height="580" fill="#fafbfc"/>

  <!-- Title -->
  <g transform="translate(40, 34)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#28a5b1" letter-spacing="0.14em">THE SERP, THEN AND NOW</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#475569">A results page for an informational query: 2007 versus 2026. Organic listings shown in teal.</text>
  </g>

  <!-- ================= LEFT: 2007 ================= -->
  <text x="240" y="96" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2007</text>
  <rect x="60" y="110" width="360" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- search bar -->
  <rect x="84" y="130" width="312" height="24" rx="12" fill="#f1f5f9"/>
  <!-- ad row -->
  <rect x="84" y="168" width="312" height="20" rx="4" fill="#fdf6ec" stroke="#f0e0c4" stroke-width="1"/>
  <text x="92" y="182" font-size="9" font-weight="700" fill="#b08948">Ad</text>
  <text x="116" y="182" font-size="10" fill="#94a3b8">Sponsored listing</text>
  <!-- 7 organic rows (representing 10) -->
  <g>
    <!-- row template repeated -->
    <g transform="translate(84,200)">
      <rect width="312" height="36" rx="4" fill="#ffffff" stroke="#eef2f6" stroke-width="1"/>
      <rect x="10" y="8" width="150" height="7" rx="3.5" fill="#28a5b1"/>
      <rect x="10" y="22" width="220" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
    <g transform="translate(84,242)">
      <rect width="312" height="36" rx="4" fill="#ffffff" stroke="#eef2f6" stroke-width="1"/>
      <rect x="10" y="8" width="170" height="7" rx="3.5" fill="#28a5b1"/>
      <rect x="10" y="22" width="200" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
    <g transform="translate(84,284)">
      <rect width="312" height="36" rx="4" fill="#ffffff" stroke="#eef2f6" stroke-width="1"/>
      <rect x="10" y="8" width="140" height="7" rx="3.5" fill="#28a5b1"/>
      <rect x="10" y="22" width="230" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
    <g transform="translate(84,326)">
      <rect width="312" height="36" rx="4" fill="#ffffff" stroke="#eef2f6" stroke-width="1"/>
      <rect x="10" y="8" width="160" height="7" rx="3.5" fill="#28a5b1"/>
      <rect x="10" y="22" width="210" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
    <g transform="translate(84,368)">
      <rect width="312" height="36" rx="4" fill="#ffffff" stroke="#eef2f6" stroke-width="1"/>
      <rect x="10" y="8" width="150" height="7" rx="3.5" fill="#28a5b1"/>
      <rect x="10" y="22" width="225" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
    <g transform="translate(84,410)">
      <rect width="312" height="36" rx="4" fill="#ffffff" stroke="#eef2f6" stroke-width="1"/>
      <rect x="10" y="8" width="175" height="7" rx="3.5" fill="#28a5b1"/>
      <rect x="10" y="22" width="195" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
  </g>
  <text x="240" y="468" font-size="11" fill="#94a3b8" text-anchor="middle">. . .</text>
  <text x="240" y="494" font-size="11.5" fill="#475569" text-anchor="middle">Ten organic listings. A couple of ads. That's it.</text>

  <!-- ================= RIGHT: 2026 ================= -->
  <text x="720" y="96" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2026</text>
  <rect x="540" y="110" width="360" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- search bar -->
  <rect x="564" y="126" width="312" height="22" rx="11" fill="#f1f5f9"/>
  <!-- Sponsored -->
  <rect x="564" y="156" width="312" height="22" rx="4" fill="#fdf6ec" stroke="#f0e0c4" stroke-width="1"/>
  <text x="572" y="170" font-size="9" font-weight="700" fill="#b08948">Ad</text>
  <text x="596" y="170" font-size="10" fill="#94a3b8">Sponsored results</text>
  <!-- AI Overview -->
  <rect x="564" y="183" width="312" height="58" rx="6" fill="#f4eefa" stroke="#d9c6ea" stroke-width="1"/>
  <text x="574" y="199" font-size="10" font-weight="700" fill="#6f4e88">AI Overview</text>
  <rect x="574" y="208" width="292" height="5" rx="2.5" fill="#c9b3df"/>
  <rect x="574" y="219" width="270" height="5" rx="2.5" fill="#c9b3df"/>
  <circle cx="580" cy="232" r="6" fill="#8c63aa"/><text x="580" y="235" font-size="8" fill="#fff" text-anchor="middle">1</text>
  <circle cx="598" cy="232" r="6" fill="#8c63aa"/><text x="598" y="235" font-size="8" fill="#fff" text-anchor="middle">2</text>
  <circle cx="616" cy="232" r="6" fill="#8c63aa"/><text x="616" y="235" font-size="8" fill="#fff" text-anchor="middle">3</text>
  <!-- Local pack -->
  <rect x="564" y="246" width="312" height="30" rx="6" fill="#edf8f1" stroke="#bfe6cf" stroke-width="1"/>
  <text x="574" y="265" font-size="10" font-weight="700" fill="#369962">Local pack (3 businesses + map)</text>
  <!-- Featured snippet -->
  <rect x="564" y="281" width="312" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="574" y="298" font-size="10" fill="#475569">Featured snippet</text>
  <!-- PAA -->
  <rect x="564" y="312" width="312" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="574" y="328" font-size="10" fill="#475569">People Also Ask</text>
  <!-- Organic 1-3 (teal) -->
  <rect x="564" y="341" width="312" height="30" rx="6" fill="#ffffff" stroke="#28a5b1" stroke-width="1.5"/>
  <text x="574" y="360" font-size="10" font-weight="700" fill="#1e8892">Organic results 1&#8211;3</text>
  <!-- Video carousel -->
  <rect x="564" y="376" width="312" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="574" y="392" font-size="10" fill="#475569">Video carousel</text>
  <!-- Organic 4-10 (teal) -->
  <rect x="564" y="405" width="312" height="30" rx="6" fill="#ffffff" stroke="#28a5b1" stroke-width="1.5"/>
  <text x="574" y="424" font-size="10" font-weight="700" fill="#1e8892">Organic results 4&#8211;10</text>
  <!-- Related searches -->
  <rect x="564" y="440" width="312" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="574" y="455" font-size="10" fill="#475569">Related searches</text>

  <text x="720" y="494" font-size="11.5" fill="#475569" text-anchor="middle">Organic (teal) is interspersed and pushed down the page.</text>

  <!-- Center arrow -->
  <g transform="translate(460,300)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <path d="M40 0 L32 -5 L32 5 Z" fill="#94a3b8"/>
  </g>
</svg>
