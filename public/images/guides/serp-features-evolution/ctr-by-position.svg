<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="880" height="460" fill="#fafbfc"/>

  <!-- Title -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#28a5b1" letter-spacing="0.14em">CLICK SHARE BY ORGANIC POSITION</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#475569">Share of clicks by organic rank in the ten-blue-links era, positions 1 to 10. Source: 2006 AOL search data.</text>
  </g>

  <!-- Y axis 0-50% -->
  <line x1="100" y1="100" x2="100" y2="380" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <line x1="96" y1="380" x2="100" y2="380" stroke="#cbd5e1" stroke-width="1"/><text x="92" y="384">0%</text>
    <line x1="96" y1="324" x2="100" y2="324" stroke="#cbd5e1" stroke-width="1"/><text x="92" y="328">10%</text>
    <line x1="96" y1="268" x2="100" y2="268" stroke="#cbd5e1" stroke-width="1"/><text x="92" y="272">20%</text>
    <line x1="96" y1="212" x2="100" y2="212" stroke="#cbd5e1" stroke-width="1"/><text x="92" y="216">30%</text>
    <line x1="96" y1="156" x2="100" y2="156" stroke="#cbd5e1" stroke-width="1"/><text x="92" y="160">40%</text>
    <line x1="96" y1="100" x2="100" y2="100" stroke="#cbd5e1" stroke-width="1"/><text x="92" y="104">50%</text>
  </g>
  <text x="42" y="240" font-size="10" fill="#475569" font-weight="600" transform="rotate(-90 42 240)" text-anchor="middle">Share of clicks</text>

  <!-- X axis -->
  <line x1="100" y1="380" x2="820" y2="380" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="430" font-size="10" fill="#475569" font-weight="600" text-anchor="middle">Organic position</text>

  <!-- Bars: 5.6px per 1%, baseline y=380 -->
  <rect x="114" y="144" width="44" height="236" rx="3" fill="#28a5b1"/>
  <text x="136" y="136" font-size="11" font-weight="700" fill="#1e8892" text-anchor="middle">42.1%</text>

  <rect x="186" y="313" width="44" height="67" rx="3" fill="#5cb9c2"/>
  <text x="208" y="305" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">11.9%</text>

  <rect x="258" y="332" width="44" height="48" rx="3" fill="#5cb9c2"/>
  <text x="280" y="324" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">8.5%</text>

  <rect x="330" y="346" width="44" height="34" rx="3" fill="#94c9cf"/>
  <text x="352" y="338" font-size="11" fill="#475569" text-anchor="middle">6.1%</text>

  <rect x="402" y="353" width="44" height="27" rx="3" fill="#94c9cf"/>
  <text x="424" y="345" font-size="11" fill="#475569" text-anchor="middle">4.9%</text>

  <rect x="474" y="357" width="44" height="23" rx="3" fill="#c2dde0"/>
  <text x="496" y="349" font-size="11" fill="#94a3b8" text-anchor="middle">4.1%</text>

  <rect x="546" y="361" width="44" height="19" rx="3" fill="#c2dde0"/>
  <text x="568" y="353" font-size="11" fill="#94a3b8" text-anchor="middle">3.4%</text>

  <rect x="618" y="363" width="44" height="17" rx="3" fill="#c2dde0"/>
  <text x="640" y="355" font-size="11" fill="#94a3b8" text-anchor="middle">3.0%</text>

  <rect x="690" y="364" width="44" height="16" rx="3" fill="#dbe7e9"/>
  <text x="712" y="356" font-size="11" fill="#94a3b8" text-anchor="middle">2.9%</text>

  <rect x="762" y="363" width="44" height="17" rx="3" fill="#dbe7e9"/>
  <text x="784" y="355" font-size="11" fill="#94a3b8" text-anchor="middle">3.0%</text>

  <!-- X labels -->
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="136" y="396">1</text><text x="208" y="396">2</text><text x="280" y="396">3</text>
    <text x="352" y="396">4</text><text x="424" y="396">5</text><text x="496" y="396">6</text>
    <text x="568" y="396">7</text><text x="640" y="396">8</text><text x="712" y="396">9</text><text x="784" y="396">10</text>
  </g>

  <!-- Footnote -->
  <text x="100" y="448" font-size="10" fill="#94a3b8">Positions 1 to 3 captured about 63% of clicks; the top 10 captured roughly 90%.</text>
</svg>
