<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="960" height="540" fill="#fafbfc"/>

  <!-- LEFT: SILOED -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#44b97b" letter-spacing="0.14em">SILOED &#8226; HIERARCHICAL</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#475569">Topical signals reinforce. Link equity flows top-down.</text>

    <!-- Root -->
    <rect x="65" y="60" width="190" height="40" rx="6" fill="#0f172a"/>
    <text x="160" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain.com</text>

    <!-- Vertical line root -> services -->
    <line x1="160" y1="100" x2="160" y2="135" stroke="#cbd5e1" stroke-width="2"/>

    <!-- /services/ -->
    <rect x="65" y="135" width="190" height="36" rx="6" fill="#28a5b1"/>
    <text x="160" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">/services/</text>

    <!-- branch into plumbing + electrical -->
    <line x1="160" y1="171" x2="160" y2="195" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="195" x2="240" y2="195" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="195" x2="80" y2="220" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="240" y1="195" x2="240" y2="220" stroke="#cbd5e1" stroke-width="2"/>

    <!-- /plumbing/ -->
    <rect x="0" y="220" width="160" height="34" rx="6" fill="#33c4d1"/>
    <text x="80" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">/plumbing/</text>

    <!-- /electrical/ -->
    <rect x="160" y="220" width="160" height="34" rx="6" fill="#33c4d1"/>
    <text x="240" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">/electrical/</text>

    <!-- plumbing children -->
    <line x1="80" y1="254" x2="80" y2="278" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="278" x2="140" y2="278" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="278" x2="20" y2="298" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="278" x2="80" y2="298" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="140" y1="278" x2="140" y2="298" stroke="#cbd5e1" stroke-width="2"/>

    <text x="20" y="320" text-anchor="middle" font-size="10" fill="#475569">/leaky-faucet/</text>
    <text x="80" y="320" text-anchor="middle" font-size="10" fill="#475569">/water-heater/</text>
    <text x="140" y="320" text-anchor="middle" font-size="10" fill="#475569">/drain-cleaning/</text>

    <!-- electrical children -->
    <line x1="240" y1="254" x2="240" y2="278" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="200" y1="278" x2="280" y2="278" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="200" y1="278" x2="200" y2="298" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="280" y1="278" x2="280" y2="298" stroke="#cbd5e1" stroke-width="2"/>

    <text x="200" y="320" text-anchor="middle" font-size="10" fill="#475569">/wiring/</text>
    <text x="280" y="320" text-anchor="middle" font-size="10" fill="#475569">/panel-upgrade/</text>

    <!-- Verdict -->
    <g transform="translate(0, 380)">
      <rect x="0" y="0" width="320" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="20" y="26" font-size="11" font-weight="700" fill="#166534" letter-spacing="0.06em">WHY IT WORKS</text>
      <text x="20" y="48" font-size="12" fill="#0f172a">Each silo reinforces its own topical signal.</text>
      <text x="20" y="66" font-size="12" fill="#0f172a">Internal links stay relevant. Hierarchy is legible.</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="480" y1="50" x2="480" y2="490" stroke="#e2e8f0" stroke-width="1"/>

  <!-- RIGHT: FLAT -->
  <g transform="translate(530, 50)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.14em">FLAT &#8226; UNSTRUCTURED</text>
    <text x="0" y="22" font-size="13" font-weight="500" fill="#475569">No hierarchy. Mixed intents. Nothing reinforces.</text>

    <!-- Root -->
    <rect x="65" y="60" width="190" height="40" rx="6" fill="#0f172a"/>
    <text x="160" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain.com</text>

    <!-- Vertical spine -->
    <line x1="160" y1="100" x2="160" y2="318" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Each child branch -->
    <g font-size="11" fill="#475569">
      <line x1="160" y1="125" x2="200" y2="125" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="129">/plumbing-service-1/</text>

      <line x1="160" y1="150" x2="200" y2="150" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="154">/plumbing-service-2/</text>

      <line x1="160" y1="175" x2="200" y2="175" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="179">/electrical-service-1/</text>

      <line x1="160" y1="200" x2="200" y2="200" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="204">/random-blog-post/</text>

      <line x1="160" y1="225" x2="200" y2="225" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="229">/about-us/</text>

      <line x1="160" y1="250" x2="200" y2="250" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="254">/pricing/</text>

      <line x1="160" y1="275" x2="200" y2="275" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="279">/contact/</text>

      <line x1="160" y1="300" x2="200" y2="300" stroke="#cbd5e1" stroke-width="2"/>
      <text x="208" y="304">/wiring-page/</text>
    </g>

    <!-- Verdict -->
    <g transform="translate(0, 380)">
      <rect x="0" y="0" width="370" height="80" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="20" y="26" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.06em">WHY IT FAILS</text>
      <text x="20" y="48" font-size="12" fill="#0f172a">Service pages, blog posts, and admin pages</text>
      <text x="20" y="66" font-size="12" fill="#0f172a">all live at the same level. Topical signal dilutes.</text>
    </g>
  </g>
</svg>
